
name: release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: automated-release

    env: 
      GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Move release to draft
        run: gh release edit "$TAG_NAME" --draft=true
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Typecheck tests
        run: npm run test:typecheck

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Create lib archive
        run: |
          zip -r lib.zip lib *.md LICENSE SECURITY.md package.json package-lock.json -x 'lib/test/*' 'lib/src/*'

      - name: Upload production artifacts
        run: |
          gh release upload $TAG_NAME "lib.zip"
          gh release edit $TAG_NAME --draft=false
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}